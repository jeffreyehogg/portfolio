[package]
name = "algoquest-core"
version = "0.1.0"
edition = "2021"
description = "Rust WebAssembly core engine, static analyzer, stress benchmark, and playable Rust quest interpreter for AlgoQuest"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
